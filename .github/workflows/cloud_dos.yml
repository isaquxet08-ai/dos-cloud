name: Cloud Build DOS System

on:
  workflow_dispatch:

jobs:
  build-dos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Install QEMU, Expect & Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 expect wget unzip

      - name: 3. Prepare Directories and Disk
        run: |
          mkdir -p DOSsystem
          mkdir -p VmsystemDOS
          qemu-img create -f qcow2 VmsystemDOS/dos_disk.img 200M

      - name: 4. Download & Extract FreeDOS
        run: |
          wget -O FD14-LiveCD.zip https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/FD14-LiveCD.zip
          unzip FD14-LiveCD.zip -d DOSsystem/

      - name: 5. Auto Install (Highlight Recognition)
        run: |
          cat << 'EXPEOF' > auto_install.exp
          #!/usr/bin/expect -f
          set timeout 300
          spawn qemu-system-i386 -cdrom DOSsystem/FD14LIVE.iso -hda VmsystemDOS/dos_disk.img -m 32 -nographic
          
          # 核心循环：让 expect 像人眼一样扫描屏幕
          expect {
              # 1. 捕捉主菜单的高亮：看屏幕上是否出现被高亮反色包裹的 "Install to harddisk"
              # \033\[7m 是终端的反色高亮控制符
              -re {.*\033\[7m.*Install to harddisk.*} {
                  sleep 1
                  send "\r"
                  exp_continue
              }
              
              # 2. 识别语言选择的高亮
              -re {.*\033\[7m.*English.*} {
                  sleep 1
                  send "\r"
                  exp_continue
              }
              
              # 3. 识别格式化的提示
              "Proceed with Format" {
                  sleep 1
                  send "y\r"
                  exp_continue
              }
              
              # 4. 识别重启提示（第一轮分区完重启，或者最后装完重启）
              "Please reboot now" {
                  sleep 2
                  send "y\r"
                  exp_continue
              }

              # 5. 识别安装包选择界面，默认高亮的是全量安装，直接回车
              "packages do you want to install" {
                  sleep 2
                  send "\r"
                  exp_continue
              }
              
              # 6. 自动按任意键继续
              "Press a key" {
                  sleep 1
                  send "\r"
                  exp_continue
              }

              # 超时容错：如果一直卡着没动静，稍微按一下回车尝试唤醒
              timeout {
                  send "\r"
                  exp_continue
              }
              
              # 进程结束
              eof {
                  exit 0
              }
          }
          EXPEOF
          chmod +x auto_install.exp
          ./auto_install.exp || true

      - name: 6. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOS-Disk
          path: VmsystemDOS/
