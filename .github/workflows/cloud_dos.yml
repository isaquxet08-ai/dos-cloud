name: Cloud Build DOS System

on:
  workflow_dispatch:

jobs:
  build-dos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Install QEMU, Expect & Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 expect wget unzip

      - name: 3. Prepare Directories and Disk
        run: |
          mkdir -p DOSsystem
          mkdir -p VmsystemDOS
          qemu-img create -f qcow2 VmsystemDOS/dos_disk.img 200M

      - name: 4. Download & Extract FreeDOS
        run: |
          wget -O FD14-LiveCD.zip https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/FD14-LiveCD.zip
          unzip FD14-LiveCD.zip -d DOSsystem/

      - name: 5. Auto Install (Smart Selection)
        run: |
          cat << 'EXPEOF' > auto_install.exp
          #!/usr/bin/expect -f
          set timeout 300
          spawn qemu-system-i386 -cdrom DOSsystem/FD14LIVE.iso -hda VmsystemDOS/dos_disk.img -m 32 -nographic
          
          # 等待菜单出现
          expect "Welcome to FreeDOS"
          sleep 2
          
          # 开始“视觉寻路”：我们不断发送下方向键，直到屏幕上出现高亮的 "Install to harddisk"
          # \033\[7m 是终端的反色高亮码，.* 代表中间的任意字符
          set selected 0
          while {$selected == 0} {
              # 监听 1 秒内的输出，看看当前高亮的是不是目标
              expect {
                  -re {.*\033\[7m.*Install to harddisk.*} {
                      # 找到了高亮目标！停止循环
                      set selected 1
                  }
                  timeout {
                      # 没找到，说明高亮还在其他选项上，再按一次下方向键
                      send "\033\[B"
                  }
              }
          }
          
          # 确认高亮在目标上后，按下回车
          sleep 1
          send "\r"
          
          # 接下来进入安装向导，开启精准文字匹配
          expect {
              "preferred language" { sleep 1; send "\r"; exp_continue }
              "keyboard layout" { sleep 1; send "\r"; exp_continue }
              "Do you want to partition" { sleep 1; send "y\r"; exp_continue }
              "Proceed with Format" { sleep 1; send "y\r"; exp_continue }
              "Press any key" { sleep 1; send "\r"; exp_continue }
              "Press a key" { sleep 1; send "\r"; exp_continue }
              "Please reboot now" { sleep 1; send "y\r"; exp_continue }
              "packages do you want to install" { sleep 2; send "\r"; exp_continue }
              timeout { send "\r"; exp_continue }
              eof { exit 0 }
          }
          EXPEOF
          chmod +x auto_install.exp
          ./auto_install.exp || true

      - name: 6. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOS-Disk
          path: VmsystemDOS/
