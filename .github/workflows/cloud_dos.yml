name: Cloud Build DOS System (Web Terminal)

on:
  workflow_dispatch:

jobs:
  build-dos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Install QEMU, Unzip, ttyd & Cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 wget unzip ttyd curl
          
          # 添加 Cloudflare 官方 APT 源并安装 cloudflared
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install -y cloudflared

      - name: 3. Prepare Directories and Disk
        run: |
          mkdir -p DOSsystem
          mkdir -p VmsystemDOS
          qemu-img create -f qcow2 VmsystemDOS/dos_disk.img 200M

      - name: 4. Download & Extract FreeDOS
        run: |
          wget -O FD14-LiveCD.zip https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/FD14-LiveCD.zip
          unzip FD14-LiveCD.zip -d DOSsystem/

      - name: 5. Launch Web Terminal via Cloudflare
        run: |
          # 1. 在后台启动 ttyd (Web 终端)，密码设为 123456
          ttyd -p 7681 -c admin:123456 bash &
          
          # 2. 使用官方安装好的 cloudflared 启动隧道
          cloudflared tunnel --url http://localhost:7681 > cloudflare.log 2>&1 &
          
          # 3. 循环等待，提取出 public URL
          echo "Waiting for Cloudflare Tunnel URL..."
          for i in {1..30}; do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cloudflare.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "=================================================="
              echo "点击这个链接进入云端终端: $URL"
              echo "账号: admin"
              echo "密码: 123456"
              echo "=================================================="
              break
            fi
            sleep 2
          done
          
          # 4. 保持工作流运行，等待你登录并安装
          sleep 600
