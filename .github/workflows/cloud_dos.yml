name: Cloud Build DOS System (Manual Mode)

on:
  workflow_dispatch:

jobs:
  build-dos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Install QEMU & Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 wget unzip

      - name: 3. Prepare Directories and Disk
        run: |
          mkdir -p DOSsystem
          mkdir -p VmsystemDOS
          qemu-img create -f qcow2 VmsystemDOS/dos_disk.img 200M

      - name: 4. Download & Extract FreeDOS
        run: |
          wget -O FD14-LiveCD.zip https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/FD14-LiveCD.zip
          unzip FD14-LiveCD.zip -d DOSsystem/

      # 关键步骤：开启 tmate 让你连进去手动操作
      - name: 5. Connect to Terminal (Manual Install)
        uses: mxschmitt/action-tmate@v3
        with:
          # 提供一句提示语
          limit-access-to-actor: true
          detached: false

      # 等你退出 SSH 后，脚本会自动继续往下跑，打包硬盘
      - name: 6. Upload Artifact (After you exit)
        uses: actions/upload-artifact@v4
        with:
          name: DOS-Disk-Manual
          path: VmsystemDOS/
