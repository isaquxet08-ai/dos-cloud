name: Cloud Build DOS System

on:
  workflow_dispatch:

jobs:
  build-dos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Install QEMU, Expect & Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 expect wget unzip

      - name: 3. Prepare Directories and Disk
        run: |
          mkdir -p DOSsystem
          mkdir -p VmsystemDOS
          qemu-img create -f qcow2 VmsystemDOS/dos_disk.img 200M

      - name: 4. Download & Extract FreeDOS
        run: |
          wget -O FD14-LiveCD.zip https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/FD14-LiveCD.zip
          unzip FD14-LiveCD.zip -d DOSsystem/

      - name: 5. Auto Install (Smart Pattern Matching)
        run: |
          cat << 'EXPEOF' > auto_install.exp
          #!/usr/bin/expect -f
          set timeout 300
          spawn qemu-system-i386 -cdrom DOSsystem/FD14LIVE.iso -hda VmsystemDOS/dos_disk.img -m 32 -nographic
          
          # 1. 极速响应模式：监听屏幕上的关键文字，出现哪个就执行对应操作
          expect {
              "Welcome to FreeDOS" {
                  sleep 1
                  send "\033\[B"; sleep 0.5; send "\033\[B"; sleep 0.5; send "\r"
                  exp_continue
              }
              "preferred language" {
                  sleep 1
                  send "\r"
                  exp_continue
              }
              "keyboard layout" {
                  sleep 1
                  send "\r"
                  exp_continue
              }
              "Do you want to partition" {
                  sleep 1
                  send "y\r"
                  exp_continue
              }
              "Set active partition" {
                  # 如果它问激活分区，通常按1然后回车
                  sleep 1
                  send "1\r"
                  exp_continue
              }
              "Proceed with Format" {
                  sleep 1
                  send "y\r"
                  exp_continue
              }
              "Press a key" {
                  sleep 1
                  send "\r"
                  exp_continue
              }
              "Reboot" {
                  sleep 1
                  send "y\r"
                  exp_continue
              }
              "installation complete" {
                  sleep 2
                  send "\r"
                  exp_continue
              }
              # 应对安装向导的各种默认Yes
              "Continue" {
                  sleep 1
                  send "\r"
                  exp_continue
              }
              # 如果跑完所有流程，超时退出（避免死循环）
              timeout {
                  send "\r"
                  exp_continue
              }
              eof {
                  exit 0
              }
          }
          EXPEOF
          chmod +x auto_install.exp
          ./auto_install.exp || true

      - name: 6. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOS-Disk
          path: VmsystemDOS/
